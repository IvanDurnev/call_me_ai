<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Markdown renderer tests</title>
<h1>Markdown renderer tests</h1><ol id="results"></ol>
<script src="/static/vendor/marked-18.1.3.umd.js"></script>
<script src="/static/vendor/purify-3.4.17.min.js"></script>
<script src="/static/chat-markdown.js"></script>
<script>
let passed = 0;
function check(name, text, assertion) {
  const node = document.createElement('div');
  window.ChatMarkdown.render(node, text);
  const item = document.createElement('li');
  try {
    if (!assertion(node)) throw new Error('Assertion failed');
    item.textContent = `PASS: ${name}`;
    passed++;
  } catch (error) { item.textContent = `FAIL: ${name}: ${error.message}`; }
  document.getElementById('results').append(item);
}
check('Bold, emphasis, lists and paragraphs', '**Жирный** и *курсив*\n\n1. Первый\n2. Второй', n =>
  n.querySelector('strong')?.textContent === 'Жирный' && n.querySelector('em') && n.querySelectorAll('ol li').length === 2);
check('Inline and fenced code preserve source', '`x < 3`\n\n```html\n<script>alert(1)<\/script>\n```', n =>
  n.querySelectorAll('code').length === 2 && !n.querySelector('script') && n.querySelector('pre code').textContent.includes('<script>'));
check('Tables and quotes', '> Цитата\n\n| A | B |\n|---|---|\n| 1 | 2 |', n =>
  n.querySelector('blockquote') && n.querySelectorAll('td').length === 2);
check('Safe links get isolation attributes', '[Сайт](https://example.com)', n =>
  n.querySelector('a')?.getAttribute('rel') === 'noopener noreferrer' && n.querySelector('a').target === '_blank');
check('Scripts, event handlers, forms and embedded content are removed', '<script>alert(1)<\/script><img src=x onerror=alert(1)><svg onload=alert(1)></svg><iframe srcdoc="bad"></iframe><form><input name=x></form>', n =>
  !n.querySelector('script,img,svg,iframe,form,input,[onerror],[onload]'));
check('Unsafe URL schemes are removed', '[bad](javascript:alert%281%29) [data](data:text/html,bad)', n =>
  !n.querySelector('a[href]'));
check('Markdown images cannot load tracking resources', '![tracker](https://example.invalid/tracker.png)', n =>
  !n.querySelector('img'));
const status = document.createElement('p');
status.id = 'status'; status.textContent = `${passed}/7 passed`;
document.body.append(status);
</script></html>
