# Installed as /etc/nginx/sites-available/games_domovoice.conf.
# Both HTTPS roots serve /games internally; HTTP only upgrades to HTTPS on the same host.
server {
    listen 80;
    server_name games.domovoice.ai www.games.domovoice.ai;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt-games;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name games.domovoice.ai www.games.domovoice.ai;
    ssl_certificate /etc/letsencrypt/live/games.domovoice.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/games.domovoice.ai/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/games.domovoice.ai/chain.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    client_max_body_size 25M;
    access_log /var/log/games_domovoice_nginx_access.log;
    error_log /var/log/games_domovoice_nginx_error.log;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt-games;
        default_type text/plain;
        try_files $uri =404;
    }
    location = / {
        proxy_pass http://127.0.0.1:10040/games;
    }
    location /ws/ {
        proxy_pass http://127.0.0.1:10040;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location /static/ {
        alias /var/www/itd/call_me_ai/static/;
    }
    location / {
        proxy_pass http://127.0.0.1:10040;
    }
}
